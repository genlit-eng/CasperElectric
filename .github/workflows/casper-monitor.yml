name: Casper vehicle monitor

on:
  workflow_dispatch:

concurrency:
  group: casper-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EXHIBITION_NO: ${{ vars.EXHIBITION_NO || vars.exhibition_no || vars.EXIBITION_NO || vars.exibition_no || secrets.EXHIBITION_NO || 'E20260902' }}
      STATE_FILE: ${{ github.workspace }}/state.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run monitor
        run: |
          python -m app.monitor

      - name: Commit state file
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f state.json ]; then
            echo "state.json not created; skipping commit."
            exit 0
          fi

          for attempt in {1..3}; do
            echo "Commit attempt $attempt..."
            git fetch origin main

            python -c "from app.state_store import StateStore; StateStore.merge_with_remote()"

            git reset origin/main
            git add state.json

            if git diff --cached --quiet; then
              echo "No state change to commit."
              break
            fi

            git commit -m "Update Casper monitor state"
            if git push origin main; then
              echo "Successfully pushed state update."
              break
            else
              echo "Push failed (concurrent update). Retrying in 2 seconds..."
              sleep 2
            fi
          done
