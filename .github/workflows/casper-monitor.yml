name: Casper vehicle monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EXHIBITION_NO: ${{ vars.EXHIBITION_NO || secrets.EXHIBITION_NO || 'E20260902' }}
      STATE_FILE: ${{ github.workspace }}/state.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run monitor
        run: |
          python -m app.monitor

      - name: Commit state file
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if git diff --cached --quiet; then
              echo "No state change to commit."
            else
              git commit -m "Update Casper monitor state"
              git push
            fi
          else
            echo "state.json not created; skipping commit."
          fi
